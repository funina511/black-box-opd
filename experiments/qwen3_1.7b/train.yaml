# Qwen3-1.7B experiment: invoke LMOps/scripts/preflight.sh or train.sh.
# All relative paths below resolve against this YAML file.
# Data production: LMOps/scripts/sample.sh.

run:
  output_root: ../../runs/gad_qwen3_1.7b
  run_id: qwen3-1.7b-4x3090
  python_bin: /mnt/jinbo/miniconda3/envs/gad/bin/python
  log_backend: console            # "console" keeps every validation metric in the stage log
  eval_after_train: false         # set true (with eval.enabled) to chain the final evaluation
  skip_completed_stages: true
  val_before_train: false          # resumed experiment: historical initial baseline is retained
  resume_worker_state: false      # --resume-gad turns this on for GAD
  # 留空 = 不动 PYTORCH_CUDA_ALLOC_CONF。
  # 注意：OOM 报错会建议 expandable_segments:True，但本流程**不能用** —— vLLM 因为
  # enable_sleep_mode=True 会启用 CuMemAllocator，它直接断言拒绝该选项
  # （vllm/device_allocator/cumem.py:146），预检现在会拦下这个取值。
  # 想压碎片只能用兼容的选项，例如 "max_split_size_mb:128"。
  pytorch_cuda_alloc_conf: ""

backends:
  source_repo: ../../gad/verl
  root: ../../gad/.backends

models:
  student: ../../assets/models/student
  discriminator_init: ../../assets/models/student   # original GAD warms the critic from the student
  trust_remote_code: true
  use_remove_padding: true
  enable_gradient_checkpointing: true
  param_offload: true            # 显存阶梯第 4 档：true 时 actor/critic 参数也放 CPU
  optimizer_offload: true         # 24GB cards: Adam states go to CPU (~5GB/GPU saved per model)
  ref_param_offload: true         # KL 参考模型只做前向，参数常驻 CPU（原版就是这么设的）

data:
  train_file: ../../data/dapo_math_17k_gad/gad_train.parquet
  val_file: ../../data/dapo_math_17k_gad/gad_dev.parquet
  prompt_key: content
  teacher_index: ../../data/dapo_math_17k_gad/teacher_index.jsonl
  manifest: ../../data/dapo_math_17k_gad/manifest.json
  # Optional but recommended: copy teacher_fingerprint_digest from the index header
  #   head -n 1 <index>.jsonl | python -c 'import json,sys;print(json.load(sys.stdin)["teacher_fingerprint_digest"])'
  expected_fingerprint_digest: "40d9199b0a66f34f8fb180725ef1b5e7f1c305f4f4fde628da3be55dd3ae2035"
  max_prompt_length: 2048
  max_response_length: 8192        # keep identical to sample_qwen3_1.7b.yaml
  truncation: right
  train_batch_size: 64             # 64 prompts x rollout.n=8 = 512 sequences/step; 128 if VRAM allows
  val_batch_size: 64               # trial value; revert to 16 if GPU validation OOMs

rollout:
  name: vllm
  n: 8                             # GAD 的组内候选数（GRPO 需要组；原版 ROLLOUT_N，且拒绝 n<2）
  # 原版 `_dapo_common.sh` 给三个阶段各自的 rollout.n：`STAGE_N_SEQKD=1`、`STAGE_N_WARMUP=1`、
  # GAD 用 ROLLOUT_N。原因写在原版注释里：seqkd/warmup 的 loss 是教师 SFT，候选**不参与**优势
  # 估计，而 actor 更新前还会 `deduplicate_by_uid()`（只保留每个 uid 的第一条），所以 n>1 只是
  # actor 会丢弃额外候选，但判别器可能使用它们；n_warmup=1 是吞吐调优，
  # 与严格 n=8 的判别器输入分布不同。
  n_seqkd: 1
  n_warmup: 1
  temperature: 0.8
  top_p: 1.0
  tensor_model_parallel_size: 1    # 1.7B student: no TP needed, 4 replicas -> better throughput
  # vLLM 必须在引擎构造时就为 **一条 max_model_len(=10240) 的序列** 留出 KV cache，否则直接
  # ValueError 拒绝启动（v1/core/kv_cache_utils.py:check_enough_kv_cache_memory）：
  #   KV/token = 2(K,V) x 8(kv heads) x 128(head_dim) x 28(layers) x 2B = 112KiB
  #   一条 10240 token 的序列 = 1.09 GiB
  # 而 0.30 x 23.5GiB = 7.05GiB 里，权重 3.4GiB + 引擎 profiling 开销 ~2.7GiB 已经占掉，
  # 只剩 0.95GiB < 1.09GiB —— 0.30 就是这么失败的（实测数字，preflight 现在会先算这一步）。
  # 0.40 -> 约 3.3GiB（≈3 条满长序列），0.35 -> 约 2.1GiB。这个池子**不会**跟训练抢显存：
  #   fsdp_vllm.py:217 在 rollout 后 sleep(level=1)：KV cache 直接丢弃、vLLM 权重卸到 CPU，
  #   而 wake_up 只是重新挂上 allocator（gpu_worker.py:100），池子大小在 init 时就定死了。
  # 所以这里给大一点是划算的：显存换生成速度，不换训练空间。
  gpu_memory_utilization: 0.55
  # vLLM 引擎上限。null = 由长度预算推导（max_prompt_length + max_response_length = 10240）。
  # 必须显式传：vLLM 自己的默认 max_num_batched_tokens=8192 小于 10240，而 chunked prefill
  # 默认开启，会在引擎构造时直接 abort（原版 harness 也是传 TOTAL_LEN）。
  max_model_len: null
  max_num_batched_tokens: null
  max_num_seqs: 128                # 原版值；一步 512 条序列由 vLLM 调度器分块
  # enforce_eager=true 关掉 CUDA graph：graph pool 走的是普通 torch caching allocator，
  # **不在** CuMemAllocator 的 sleep 路径里（sleep 只处理 weights/kv_cache 两个 tag），
  # 所以它会一直占着训练阶段的显存。后端/原版 harness 的默认也是 True（ENFORCE_EAGER:=True）。
  enforce_eager: true
  # 注意：vLLM 0.8.5 下 free_cache_engine 是**空操作** —— vllm_rollout_spmd.py:269,445 的
  # 释放逻辑被 `vllm_version in ("0.5.4","0.6.3")` 挡掉了；它对 vLLM 的唯一作用是
  # vllm_rollout_spmd.py:90 的断言，强制 enforce_eager=true。KV cache 的释放/权重的
  # offload 已经由 sharding manager 每步自动完成，不需要这个开关（也别指望靠它省显存）。
  free_cache_engine: false
  val_n: 1                         # dev monitor: single deterministic generation per question
  val_do_sample: false
  val_temperature: 0.0
  enable_thinking: false           # forwarded by the gad-chat-template-kwargs patch
  thinking_control: true

budget:
  # 原版是 **epoch 口径**，不是固定步数（scripts/reference/gpt5-chat-filtered-7b-*.sh）：
  #   seqkd  total_epochs=4
  #   warmup total_epochs=2（官方 README 写 1 epoch，LMOps/GAD修改计划.md §3.2 取 README 的 1）
  #   gad    total_epochs=4，且 GAD 续接 Warmup 的 global step ⇒ 4 是**绝对目标**：
  #          新增步数 = 4×steps_per_epoch − Warmup 的最后一步
  #          （warmup=1 时 GAD 新增 3 epoch；把 warmup 改成 2 则 GAD 新增 2 epoch）
  # 真实步数 = epoch × (train_rows // train_batch_size)，换了池子/batch 会自动跟着变。
  stage_epochs:
    seqkd: 4
    warmup: 1
    gad: 4
  # 下面三个只在 stage_epochs 里没给对应阶段时才生效（冒烟/快速试跑留的口子）。
  seqkd_steps: 200
  warmup_steps: 800
  gad_steps: 200
  epochs_override: null
  handoff_step: null               # null -> use the last complete Warmup checkpoint

optim:
  seqkd_actor_lr: 5.0e-6
  warmup_actor_lr: 1.0e-6
  warmup_critic_lr: 1.0e-6
  gad_actor_lr: 1.0e-6
  gad_critic_lr: 1.0e-6
  grad_clip: 0.2
  kl_loss_coef: 0.001              # GAD/Warmup KL anchor = the merged Warmup actor (original behaviour)
  kl_loss_type: low_var_kl
  entropy_coeff: 0.0
  critic_warmup: 10                # SeqKD/Warmup only; GAD forces 0
  # R5（原版 `_dapo_common.sh`：CRITIC_DYNAMIC_BSZ=False / CRITIC_MICRO=1）：判别器分批与 actor
  # **解耦**，默认静态、每微批 1 条样本。这条不是可选的调优，而是原版口径：
  #   * 判别器同时前向学生与教师，静态 micro=1 ⇒ 单条样本两侧各自 ≤ 10240 padded token，
  #     不会出现"学生 1024 + 教师 16384"的超预算微批；
  #   * 静态分批走 `batch.split(micro)`，**根本不调用** `rearrange_micro_batches`，
  #     因此判别器与 pinned 代码逐位等价（补丁 4 只影响 actor 的分批）。
  # 设成 true 会退回动态分批：更快，但判别器的分批规则被补丁 4 改变，属于偏离（见 PIPELINE §3.2）。
  critic_dynamic_bsz: false
  critic_micro_batch_size_per_gpu: 1
  # 训练阶段 OOM 的显存阶梯（依次只加一档，重跑同一条命令即可）：
  #   1) rollout.enforce_eager=true                        ← 已默认开（去掉常驻的 CUDA graph pool）
  #   2) rollout.gpu_memory_utilization 0.40（下限 ~0.33，否则 vLLM 起不来；见 rollout 注释）
  #   3) actor/critic_ppo_max_token_len_per_gpu 12288 → 10240
  #      （下限就是 10240 = prompt+response：越界的 micro-batch 会把 LM head logits 顶到
  #        ~3.7GiB；卡到 10240 后最坏只有单条满长序列 ≈ 3.1GiB。
  #        再低会触发后端 assert max_token_len >= 序列长度）
  #   4) models.param_offload true                         （actor/critic 参数放 CPU）
  #   5) data.train_batch_size 64 → 32                     （缩 rollout 批）
  #   ⚠ 别加 expandable_segments（run.pytorch_cuda_alloc_conf 有说明），也别靠
  #     rollout.free_cache_engine 省显存（vLLM 0.8.5 下是空操作）。
  actor_ppo_max_token_len_per_gpu: 10240   # successful run value; exactly one full prompt+response budget
  critic_ppo_max_token_len_per_gpu: 12288

resources:
  n_gpus_per_node: 4
  nnodes: 1                        # multi-node is not verified; keep 1
  gpus: "1,2,3,4"                  # the cards used for training (teacher must be stopped first)
  save_freq: 50
  test_freq: 200                    # quick at intermediate steps, full at final step
  max_actor_ckpt_to_keep: null      # null keeps every checkpoint (handoff needs the last one intact)
  max_critic_ckpt_to_keep: null

eval:
  enabled: false                   # turn on after eval.out_dir is prepared
  parquet: ../../assets/datasets/math_eval/test.parquet
  benchmarks: aime24,aime25,amc23,amc24,math500
  # CARD's paper protocol is n=16 / math500 n=2 / 32768 tokens. On 4x3090 24GB that is
  # extremely slow (32k KV ~ 3.6GB per sequence): start with n=8, max_tokens=16384 and
  # say so in the report instead of claiming CARD parity.
  n: 8
  math500_n: 2
  temperature: 1.0
  top_p: 0.95
  max_tokens: 16384
  max_model_len: 20480             # must exceed prompt + max_tokens
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.85
  backend: vllm
  dev_n: 1
  dev_do_sample: false

validation:
  scorer_path: ""                  # "" -> LMOps/sample/math_scorer.py (CARD-aligned)
  require_math_metrics: true
  quick_size: 128
  quick_seed: 42
  final_full: true
  quick_enabled: true
  quick_file: ../../data/dapo_math_17k_gad/quick_dev.parquet
