# Global defaults for NEW experiments. Each launch saves its resolved train.yaml in runs/.
# Select model/dataset below, in scripts/train.sh, or with --model / --dataset.
# GAD stage_epochs=2 is an ABSOLUTE target including Warmup; use 3 for 2 additional epochs.
# Resume/export/evaluate an existing experiment with --run; its saved config is authoritative.
selection:
  model: qwen3_0.6b
  dataset: dapo_math_17k
catalog:
  models:
    qwen3_0.6b:
      models:
        student: ../model/Qwen/Qwen3-0.6B
    qwen3_1.7b:
      models:
        student: ../model/Qwen/Qwen3-1.7B
  datasets:
    dapo_math_5k:
      data:
        train_file: data/dapo_math_5k_gad/gad_train.parquet
        val_file: data/dapo_math_17k_gad/gad_dev.parquet
        teacher_index: data/dapo_math_17k_gad/teacher_index.jsonl
        manifest: data/dapo_math_5k_gad/manifest.json
        expected_fingerprint_digest: 40d9199b0a66f34f8fb180725ef1b5e7f1c305f4f4fde628da3be55dd3ae2035
      validation:
        quick_file: data/dapo_math_17k_gad/quick_dev.parquet
    dapo_math_17k:
      data:
        train_file: data/dapo_math_17k_gad/gad_train.parquet
        val_file: data/dapo_math_17k_gad/gad_dev.parquet
        teacher_index: data/dapo_math_17k_gad/teacher_index.jsonl
        manifest: data/dapo_math_17k_gad/manifest.json
        expected_fingerprint_digest: 40d9199b0a66f34f8fb180725ef1b5e7f1c305f4f4fde628da3be55dd3ae2035
      validation:
        quick_file: data/dapo_math_17k_gad/quick_dev.parquet
legacy_runs:
  qwen3_0.6b_5k: runs/gad_qwen3_0.6b_5k/qwen3-0.6b-5k-seed42-n2
  qwen3_0.6b_17k: runs/gad_qwen3_0.6b_17k/qwen3-0.6b-17k-n2
  qwen3_1.7b: runs/gad_qwen3_1.7b/qwen3-1.7b-4x3090
run:
  output_root: runs
  run_id: auto
  python_bin: /mnt/jinbo/miniconda3/envs/gad/bin/python
  log_backend: console
  eval_after_train: false
  skip_completed_stages: true
  val_before_train: false
  resume_worker_state: false
  pytorch_cuda_alloc_conf: ''
backends:
  profile: original # Enabling rubric/replay selects an isolated extension backend.
  source_repo: gad/verl
  root: gad/.backends
models:
  trust_remote_code: true
  use_remove_padding: true
  enable_gradient_checkpointing: true
  param_offload: true
  optimizer_offload: true
  ref_param_offload: true
data:
  prompt_key: content
  max_prompt_length: 2048
  max_response_length: 8192
  truncation: right
  train_batch_size: 64
  val_batch_size: 64
rollout:
  name: vllm
  n: 2
  n_seqkd: 1
  n_warmup: 1
  temperature: 0.8
  top_p: 1.0
  tensor_model_parallel_size: 1
  gpu_memory_utilization: 0.55
  max_model_len: null
  max_num_batched_tokens: null
  max_num_seqs: 128
  enforce_eager: true
  free_cache_engine: false
  val_n: 1
  val_do_sample: false
  val_temperature: 0.0
  enable_thinking: false
  thinking_control: true
budget:
  stage_epochs:
    seqkd: 2
    warmup: 1
    gad: 2
  seqkd_steps: 200
  warmup_steps: 800
  gad_steps: 200
  epochs_override: null
  handoff_step: null
optim:
  seqkd_actor_lr: 5.0e-06
  warmup_actor_lr: 1.0e-06
  warmup_critic_lr: 1.0e-06
  gad_actor_lr: 1.0e-06
  gad_critic_lr: 1.0e-06
  grad_clip: 0.2
  kl_loss_coef: 0.001
  kl_loss_type: low_var_kl
  entropy_coeff: 0.0
  critic_warmup: 10
  critic_dynamic_bsz: false
  critic_micro_batch_size_per_gpu: 1
  actor_ppo_max_token_len_per_gpu: 10240
  critic_ppo_max_token_len_per_gpu: 12288
resources:
  n_gpus_per_node: 4
  nnodes: 1
  gpus: 1,2,3,4
  judge_gpus: 6,7 # Independent service; never included in Ray training resources.
  save_freq: 50
  keep_last_checkpoints: 5
  test_freq: 200
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
eval:
  enabled: false
  parquet: assets/datasets/math_eval/test.parquet
  benchmarks: aime24,aime25,amc23,amc24,math500
  n: 8
  math500_n: 2
  temperature: 1.0
  top_p: 0.95
  max_tokens: 16384
  max_model_len: 20480
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.85
  backend: vllm
  dev_n: 1
  dev_do_sample: false
validation:
  scorer_path: ''
  require_math_metrics: true
  quick_size: 128
  quick_seed: 42
  final_full: true
  quick_enabled: true

# Online supervision begins with the first Warmup critic update; actor reward stays adv.
rubric:
  enabled: false
  stages: [warmup, gad]
  mode: joint # correctness_only uses the rule scorer without a process judge.
  loss_coef: 0.1
  spec: rubric/specs/math_v1.yaml
  prompt: rubric/prompts/judge_math_v1.txt
  head_layout: [adv, answer_correctness, reasoning_validity, condition_coverage]
  reward_source: adv_only
  label_source: online
  label_scope: selected_critic_batch
  teacher_cache: true
  student_cache: true
  truncated_process_policy: mask
  on_annotation_error: mask
  on_service_unavailable: abort_step
  seed: 42
  judge:
    backend: openai_compatible
    base_url: http://127.0.0.1:8010/v1
    model: Qwen3-8B
    model_revision: local-sha256
    tokenizer_path: ../model/Qwen/Qwen3-8B
    api_key_env: null
    temperature: 0
    max_output_tokens: 768
    max_context_tokens: 16384
    structured_output: required
    concurrency: 8
    request_timeout_seconds: 120
    step_timeout_seconds: 600
    max_retries: 2
    dtype: bfloat16
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    cpu_offload_gb: 0

replay:
  enabled: false
  stages: [gad]
  mix_ratio: 0.25
  max_age_steps: 8
  capacity_pairs: 1024
  max_bytes: 536870912
  sampling: uniform_without_replacement
  eviction: oldest_first
  insert_after_step: true
  store_labels: true
  seed: 43
